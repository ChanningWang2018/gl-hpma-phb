[build]
  command = "npm run build"
  publish = "dist"

# ====== 静态资源：永久缓存 ======

# JavaScript 文件
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS 文件
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片资源
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ====== 动态数据：每hour缓存（游戏每周更新） ======

# Archive 数据文件（1 hour）
[[headers]]
  for = "/archive/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Data 文件（1 hour）
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ====== 特殊文件：中期缓存 ======

# OG 图片（1天）
[[headers]]
  for = "/og-image.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ====== HTML：不缓存 ======

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ====== 安全头：应用到所有文件 ======

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# ====== 卡面透明代理（卡牌图鉴 L2 降级源） ======
# 代理 jsDelivr 上锁定 tag 的 spellbook 卡面（版权口径：CDN 式缓存，本站不存图源字节）。
# 必须放在下方 catch-all 之前 —— Netlify redirects 先到先得，被 /* 吞掉就失效了。
# 版本升级时此处的 tag 与 public/data/spellbook/version.json 的 imageBase 同步换。

[[redirects]]
  from = "/cardimg/*"
  to = "https://fastly.jsdelivr.net/gh/ChanningWang2018/hpma-data@spellbook-v5.20261004.0/spellbook/:splat"
  status = 200
  force = true

# ====== 路由重定向 ======

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false