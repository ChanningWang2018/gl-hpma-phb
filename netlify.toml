[build]
  command = "npm run build:prerender"
  publish = "dist"

# The prerender pass is the slow part of the build. Run one page per CPU-ish
# worker and keep Puppeteer's Chrome in Netlify's persisted cache so a retry
# does not download it again.
[build.environment]
  PRERENDER_WORKERS = "4"
  PUPPETEER_CACHE_DIR = "/opt/build/cache/puppeteer"

# ====== 静态资源：永久缓存 ======

# JavaScript 文件
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS 文件
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片资源
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ====== 动态数据：每hour缓存（游戏每周更新） ======

# Archive 数据文件（1 hour）
[[headers]]
  for = "/archive/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Data 文件（1 hour）
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ====== 特殊文件：中期缓存 ======

# OG 图片（1天）
[[headers]]
  for = "/og-image.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ====== HTML：不缓存 ======

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ====== 安全头：应用到所有文件 ======

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# ====== 卡面 / 回响图标透明代理（数据仓 L2 降级源） ======
# 2026-10 起数据仓拆为 hpma-bits/hpma-spellbook 的 cards/ 与 echoes/ 两个模块。
# L1 直连 raw.githubusercontent（version.json imageBase）；L2 用同源代理兜底，
# 避免客户端网络无法直连 GitHub 时图片全灭。必须放在下方 catch-all 之前。

[[redirects]]
  from = "/cardimg/*"
  to = "https://raw.githubusercontent.com/hpma-bits/hpma-spellbook/cards-v1.20261024.0/cards/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/echoimg/*"
  to = "https://raw.githubusercontent.com/hpma-bits/hpma-spellbook/echoes-v1.20261024.0/echoes/:splat"
  status = 200
  force = true

# ====== 路由重定向 ======

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false