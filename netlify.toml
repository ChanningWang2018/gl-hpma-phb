[build]
  command = "npm run build"
  publish = "dist"

# ====== 静态资源：永久缓存 ======

# JavaScript 文件
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS 文件
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片资源
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ====== 动态数据：每hour缓存（游戏每周更新） ======

# Archive 数据文件（1 hour）
[[headers]]
  for = "/archive/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Data 文件（1 hour）
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ====== 特殊文件：中期缓存 ======

# OG 图片（1天）
[[headers]]
  for = "/og-image.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ====== HTML：不缓存 ======

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ====== 安全头：应用到所有文件 ======

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# ====== 路由重定向 ======

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false