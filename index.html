<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Masthead font: vendored, preloaded (no external font stylesheet) -->
    <link
      rel="preload"
      href="/fonts/unifrakturmaguntia-normal-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- DNS Prefetch and Preconnect -->
    <link rel="dns-prefetch" href="https://hpma-phb.netlify.app" />
    <link rel="preconnect" href="https://hpma-phb.netlify.app" />
    <!-- 卡面 / 回响图源（version.json imageBase）：无 crossorigin，匹配 <img>
         的 no-cors 请求才能复用预热连接。2026-10 起数据仓为 hpma-bits/hpma-spellbook。 -->
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />

    <!-- Preload Important Resources -->
    <link rel="preload" href="/favicon.ico" as="image" />
    <link rel="preload" href="/og-image.webp" as="image" />

    <!-- SEO: Page Title -->
    <title>my little hpma bits</title>

    <meta
      name="google-site-verification"
      content="uGK4op9fcRd4DavVDggsuX2xvzyIaCT4rlNsRh4ynhU"
    />
    <!-- SEO: Meta Description -->
    <meta
      name="description"
      content="An unofficial almanac for Harry Potter: Magic Awakened — weekly echo statistics, a 141-card codex, a sales solver and 1,847 quiz questions."
    />

    <!-- SEO: Keywords -->
    <meta
      name="keywords"
      content="HPMA, Harry Potter Magic Awakened, Echo, Win Rate, Pick Rate, Analytics, Character Guide, Statistics"
    />

    <!-- SEO: Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical / og:url are emitted per route by useHead (P0b). -->

    <!-- Open Graph: Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="my little hpma bits — HPMA weekly data, cards & quiz"
    />
    <meta
      property="og:description"
      content="An unofficial almanac for Harry Potter: Magic Awakened — weekly echo statistics, a 141-card codex, a sales solver and 1,847 quiz questions."
    />
    <meta
      property="og:image"
      content="https://hpma-phb.netlify.app/og-image.webp"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="my little hpma bits — HPMA weekly data, cards & quiz"
    />
    <meta
      name="twitter:description"
      content="An unofficial almanac for Harry Potter: Magic Awakened — weekly echo statistics, a card codex, a sales solver and a quiz drill."
    />
    <meta
      name="twitter:image"
      content="https://hpma-phb.netlify.app/og-image.webp"
    />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-WY2EH3KFV1"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-WY2EH3KFV1');
