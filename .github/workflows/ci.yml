name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions for security
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent infinite hangs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Guard against hand-edited spellbook data drifting from the upstream
      # release: audits cards + echoes sha256 against each pinned tag's
      # checksums.txt. Needs no npm dependencies, only node + network.
      - name: Verify spellbook data integrity
        run: node scripts/fetch-spellbook-modules.mjs --verify

      - name: Install dependencies
        run: npm ci
        env:
          # PR CI never prerenders, so skip Puppeteer's Chrome download here;
          # the prerender gate downloads it only in its own job (see #20).
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent infinite hangs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
