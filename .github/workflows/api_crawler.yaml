name: API Crawler - 48h Interval

on:
  schedule:
    # Run every 24 hours at 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:  # Manual trigger for debugging

env:
  # API Configuration - centralized for easy maintenance
  API_URL: https://www.163hot.net/hp/phb/getData
  USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  REFERER: https://www.163hot.net/
  ORIGIN: https://www.163hot.net

# Minimal permissions for security
permissions:
  contents: write  # Only need write access for commits

jobs:
  crawl-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent infinite hangs
    
    steps:
      # ========== 1. Repository Setup ==========
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for proper tagging

      # ========== 2. API Data Collection ==========
      - name: Fetch API data
        id: fetch-data
        run: |
          # Create archive directory
          mkdir -p public/archive
          
          # Generate timestamp for versioning
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          ARCHIVE_FILE="public/archive/${TIMESTAMP}.json"
          
          # Download API response with proper headers
          RESPONSE=$(curl -s -w "\n%{http_code}" -o response_body.json \
                    -H "User-Agent: ${{ env.USER_AGENT }}" \
                    -H "Referer: ${{ env.REFERER }}" \
                    -H "Origin: ${{ env.ORIGIN }}" \
                    --max-time 45 \
                    "${{ env.API_URL }}")
          
          # Separate HTTP status from response
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
            exit 0  # Don't fail workflow, allow notification
          fi
          
          # Validate JSON structure
          if ! jq empty response_body.json 2>/dev/null; then
            echo "success=false" >> $GITHUB_OUTPUT
            echo "status=422" >> $GITHUB_OUTPUT  # 422: Unprocessable Entity
            exit 0
          fi
          
          # Save successful response
          mv response_body.json "$ARCHIVE_FILE"
          echo "success=true" >> $GITHUB_OUTPUT
          echo "archive_file=$ARCHIVE_FILE" >> $GITHUB_ENV
          
          # Cleanup
          rm -f response_body.json

      # ========== 3. Change Detection ==========
      - name: Detect data changes
        if: steps.fetch-data.outputs.success == 'true'
        id: detect-changes
        run: |
          # Create snapshot if it doesn't exist
          [ -f snapshot.json ] || echo '{}' > snapshot.json
          
          # Calculate content hashes for comparison
          OLD_HASH=$(jq -cS . snapshot.json | sha256sum | awk '{print $1}')
          NEW_HASH=$(jq -cS . "${{ env.archive_file }}" | sha256sum | awk '{print $1}')
          
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            # Update snapshot to latest version
            cp "${{ env.archive_file }}" snapshot.json
          fi

      # ========== 4. Version Control Updates ==========
      - name: Commit changes if detected
        if: steps.fetch-data.outputs.success == 'true' && steps.detect-changes.outputs.changed == 'true'
        run: |
          # Configure Git identity for automation
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Get data statistics for commit message
          ITEM_COUNT=$(jq '.data | length' "${{ env.archive_file }}" 2>/dev/null || echo 0)
          TIMESTAMP=$(basename "${{ env.archive_file }}" .json)
          
          # ========== Update manifest.json ==========
          echo "Updating manifest.json with new archive file..."
          
          # Ensure manifest.json exists
          if [ ! -f "public/archive/manifest.json" ]; then
            echo "Creating initial manifest.json file..."
            echo '{"description": "回响数据清单", "lastUpdated": "", "files": []}' > public/archive/manifest.json
          fi
          
          # Extract date information from the first huixianginfo item
          START_DATE=$(jq -r '.data.huixianginfo[0].starttimedate' "${{ env.archive_file }}" 2>/dev/null | sed 's/ //g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
          END_DATE=$(jq -r '.data.huixianginfo[0].endtimedate' "${{ env.archive_file }}" 2>/dev/null | sed 's/ //g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || echo "")
          
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ] && [ "$START_DATE" != "null" ] && [ "$END_DATE" != "null" ]; then
            # Create period string (ensure consistent date format)
            PERIOD="${START_DATE} - ${END_DATE}"
            FILENAME=$(basename "${{ env.archive_file }}")
            TODAY=$(date +%Y-%m-%d)
            
            # Update manifest.json using jq
            echo "Adding file: $FILENAME with period: $PERIOD"
            
            # Create backup of manifest.json
            cp public/archive/manifest.json public/archive/manifest.json.backup 2>/dev/null || true
            
            # Update manifest.json - append new file to the beginning of the array
            jq --arg filename "$FILENAME" \
               --arg period "$PERIOD" \
               --arg today "$TODAY" \
               '.lastUpdated = $today | .files = [{period: $period, file: $filename}] + .files' \
               public/archive/manifest.json > public/archive/manifest.tmp && mv public/archive/manifest.tmp public/archive/manifest.json
            
            # Validate the updated manifest
            if jq empty public/archive/manifest.json 2>/dev/null; then
              echo "✅ manifest.json updated successfully"
            else
              echo "⚠️  Failed to update manifest.json, restoring backup"
              mv public/archive/manifest.json.backup public/archive/manifest.json 2>/dev/null || true
            fi
          else
            echo "⚠️  Could not extract date information from archive file"
            echo "Using fallback period based on filename timestamp"
            FILENAME=$(basename "${{ env.archive_file }}")
            TODAY=$(date +%Y-%m-%d)
            
            # Extract date from filename (YYYYMMDD-HHMMSS format)
            FILENAME_DATE=$(echo "$FILENAME" | grep -o '^[0-9]\{8\}' || echo "")
            if [ -n "$FILENAME_DATE" ]; then
              # Format date as YYYY/MM/DD
              FORMATTED_DATE=$(echo "$FILENAME_DATE" | sed 's/\([0-9]\{4\}\)\([0-9]\{2\}\)\([0-9]\{2\}\)/\1\/\2\/\3/')
              PERIOD="${FORMATTED_DATE} data archive"
            else
              PERIOD="Weekly data archive"
            fi
            
            # Update manifest.json with fallback period
            jq --arg filename "$FILENAME" \
               --arg period "$PERIOD" \
               --arg today "$TODAY" \
               '.lastUpdated = $today | .files = [{period: $period, file: $filename}] + .files' \
               public/archive/manifest.json > public/archive/manifest.tmp && mv public/archive/manifest.tmp public/archive/manifest.json
          fi
          
          # Clean up backup file
          rm -f public/archive/manifest.json.backup 2>/dev/null || true
          
          # Commit all changes: snapshot, archived file, and manifest
          echo "Committing changes to repository..."
          git add snapshot.json "${{ env.archive_file }}" public/archive/manifest.json
          git commit -m "chore: update API snapshot (${TIMESTAMP})
          
          - Items: ${ITEM_COUNT}
          - Source: ${{ env.API_URL }}
          - Updated manifest.json
          - Auto-update"
          
          # Create version tag
          git tag "v${TIMESTAMP}"
          git push origin main --tags
